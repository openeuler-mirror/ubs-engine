# Default authentication configuration file
# Defines base user-role and role-permission mappings with priority flags.

[auth.user.default]
# Section for default user-to-role mappings.
ubsmd = default_ubsm
ubs-scheduler = default_op
matrixplugin = default_k8s

[auth.role.default]
# Section for default role-to-permission mappings.
default_ubsm = mem.fd,mem.numa,mem.shm,mem.stat,topo,mem.shm.migrate
default_op = topo,npu
default_k8s = mem.numa,topo

[auth.shm.migrate]
# Additional users allowed to migrate/query/cancel shared memory owned by other users.
# Comma-separated, case-sensitive usernames; no wildcard. Creator, root and ubse are allowed by default.
# Empty values are invalid. Uncomment only when additional users are needed.
# SDK interface RBAC permission mem.shm.migrate is also required, including for the creator.
# Built-in root/ubse also pass resource permission checks without being listed here.
# Configure consistently on all master candidates and restart ubse after changes.
# The old [ubse.memory] shm.migrate.allowedUsers option is no longer read.
# allowedUsers=operator,automation

[auth.vsock.cid2user]
# Mapping of vsock source CID to user for authentication.
# Format: <cid> = <username>
# This is used when vsock connections arrive to determine the user identity for authorization.
# Example:
# 1 = ubsmd
# 2 = ubs-scheduler
