# Name of the process_mem plugin. Fixed value: process_mem.
ubse.plugin.name=process_mem
# Name of the SO file on which the process_mem module depends. Fixed value: libprocess_mem.so.
ubse.plugin.pkg=libprocess_mem.so

[process_mem]
# 采集周期, 读 /proc 的间隔 (可配范围 1-3600s)
collect_process_interval=5
# 默认 on, 跳过 root 进程
filter_root_process=true
# 决策周期, 借用/归还的执行间隔 (可配范围 1-3600s)
schedule_interval=5
# 节点空闲触发借用阈值 (f), 由容量规划推导 f = S − k×d×r, 可配范围 1-4096 GB, 越界回退默认 15,
# 建议不超过本机最大内存, 且大于 emergency_free_threshold
pressing_free_threshold=15
# 借用超时, 每 128MB 粒度的耗时 (ms), 可配范围 1-1800000 (30 分钟), 越界回退默认 1000
borrow.timeout=1000
# 是否必须同平面借用 (true=必须, 严格过滤; false=优先, 评分加权)
borrow.must_same_plane=false

# 主动归还 (可选, 均有默认值)
[process_mem.return]
# 连续快速检测周期数: 仅紧急 fast 轮询(200ms)期间记录节点 free, 每 n 次结算一次取最小值,
# 窗口最小 free > pressing_free_threshold 时触发主动归还 (默认 300×200ms=60s 观察期), 可配范围 1-4096, 越界回退默认 300
observe_cycles=300

# OOM 快速检测 (可选, 均有默认值)
[process_mem.oom]
# 紧急状态轮询间隔 (ms), 可配范围 50-60000, 越界回退默认 200
collect_node_interval=200
# 紧急借用/转嫁阈值 (GB), 可配范围 1-4096, 越界回退默认 5, 建议小于 pressing_free_threshold
emergency_free_threshold=5
