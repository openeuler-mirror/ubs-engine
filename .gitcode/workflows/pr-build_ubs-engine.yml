name: ubs-engine_build

on:
  pull_request:
    types: 
      - open
      - reopen
      - update
    branches:
      - master
  pull_request_comment:
    types: [created]
    comments: [ '^recompile$' ]
    branches:
      - master
env:
  pr_id: ${{ atomgit.event.pull_request.number }}

defaults:
  run:
    shell: bash

concurrency:
  enable: true
  max: 5
  exceed-action: QUEUE

permissions:
  project: read
  repository: read
  pr: write

stages:
  codecheck:
    name: CodeCheck
    jobs:
      CodeCheck_pre_commit:
        name: CodeCheck_pre_commit
        runs-on: [self-hosted, openeuler, x86, cpu=16]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/docker-xian/beiming-openeuler-22.03-lts-sp4-x86_64:v1
        steps:
          - name: checkout
            uses: checkout
            with:
              ref: refs/merge-requests/${{ env.pr_id }}/merge
              allow-unsafe-pr-checkout: true
          - name: Checkout Platform Code
            run: git clone -b openEuler-24.03-LTS-SP4 https://gitcode.com/src-openeuler/ubs-comm.git /tmp/src/ubs-comm
          - name: Install System pre-commit
            run: | 
                set -eux
                clang-format --version
                PYTHON3_BIN=$(dirname "$(which python3)")
                ln -sf "$(which python3)" "$PYTHON3_BIN/python"
                echo "$PYTHON3_BIN" >> "$ATOMGIT_PATH"
                python --version
                python -m pip install --upgrade pip --timeout 120 --ignore-installed
                pip3 config set global.index-url https://mirrors.huaweicloud.com/repository/pypi/simple
                cd ${ATOMGIT_WORKSPACE}
                pip3 install pre-commit==4.3.0 pre-commit-hooks && pre-commit install --install-hooks
          - name: RPM Build ubs-comm
            run: bash scripts/ci_prepare_ubs-comm.sh
          - name: install gitleaks 
            run: | 
                cd ${ATOMGIT_WORKSPACE} 
                cp -rf /opt/buildtools/gitleaks ./ 
                cd -
          - name: pre-commit
            uses: openlibing-pre-commit-action
  compile:
    name: Compile and DT
    jobs:
      ubs-engine_compile:
        name: ubs-engine_compile
        runs-on: [self-hosted, openeuler, x86, cpu=16]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/jh-partner-collab/beiming-openeuler-24.03-lts-sp3-x86_64:v2
        steps:
          - name: Checkout Platform Code
            run: git clone -b openEuler-24.03-LTS-SP4 https://gitcode.com/src-openeuler/ubs-comm.git /tmp/src/ubs-comm
          - name: Checkout Source Code
            uses: checkout
            with:
              ref: refs/merge-requests/${{ env.pr_id }}/merge
              allow-unsafe-pr-checkout: true
          - name: RPM Build ubs-comm
            run: bash scripts/ci_prepare_ubs-comm.sh
          - name: Build ubs-engine
            run: | 
                set -eux
                ls -al
                bash build.sh
      ubs-engine_ut:
        name: ubs-engine_ut
        runs-on: [self-hosted, openeuler, x86, cpu=32]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/jh-partner-collab/beiming-openeuler-24.03-lts-sp3-x86_64:v2
        steps:
          - name: Checkout Platform Code
            run: git clone -b openEuler-24.03-LTS-SP4 https://gitcode.com/src-openeuler/ubs-comm.git /tmp/src/ubs-comm 
          - name: Checkout Source Code
            uses: checkout
            with:
              ref: refs/merge-requests/${{ env.pr_id }}/merge
              allow-unsafe-pr-checkout: true
          - name: RPM Build ubs-comm
            run: bash scripts/ci_prepare_ubs-comm.sh
          - name: UT ubs-engine
            run: | 
                set -eux
                sudo dnf install -y gmock-devel
                ls -al
                bash build.sh ut -j 3