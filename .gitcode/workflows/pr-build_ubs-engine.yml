name: ubs-engine_build

on:
  pull_request:
    types: 
      - open
      - reopen
      - update
    branches:
      - master
      - openEuler*
      - br_UnifiedBus
    paths:
      - "src/**"
      - "!src/addons/virt_agent/**"
      - "!src/addons/rmrs/**"
      - "!src/addons/ucache/**"
      - "!src/addons/process_mem/**"
      - "test/**"
      - "!test/UT/exclusive_executable/virt_agent/**"
      - "!test/UT/exclusive_executable/rmrs/**"
      - "!test/UT/exclusive_executable/ucache/**"
      - "!test/UT/exclusive_executable/process_mem/**"
      - "scripts/**"
      - "build.sh"
      - "CMakeLists.txt"
      - "src/include/**"
  pull_request_comment:
    types: [created]
    comments: [ '^recompile$' ]
    branches:
      - master
      - openEuler*
      - br_UnifiedBus
env:
  pr_id: ${{ atomgit.event.pull_request.number }}

defaults:
  run:
    shell: bash

concurrency:
  enable: true
  max: 5
  exceed-action: QUEUE

permissions:
  project: read
  repository: read
  pr: write

stages:
  compile:
    name: Compile and DT
    jobs:
      ubs-engine_compile:
        name: ubs-engine_compile
        runs-on: [self-hosted, openeuler, arm, cpu=16]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/ubscore/build-openeuler-24.03-lts-sp3-arm:latest
        steps:
          - name: Checkout Source Code
            uses: checkout
            with:
              ref: refs/merge-requests/${{ env.pr_id }}/merge
              allow-unsafe-pr-checkout: true
          - name: install ubs-comm
            run: | 
                echo '[updates1]' >> /etc/yum.repos.d/openEuler.repo
                echo 'name=local_base1' >> /etc/yum.repos.d/openEuler.repo
                echo 'baseurl=https://eulermaker.openeuler.openatom.cn/api/ems2/repositories/BeiMing_openEuler2403_Next/openEuler%3A24.03-LTS-SP3/aarch64/' >> /etc/yum.repos.d/openEuler.repo
                echo 'gpgcheck=0' >> /etc/yum.repos.d/openEuler.repo
                echo 'enable=1' >> /etc/yum.repos.d/openEuler.repo
                yum install -y ubs-comm-devel
          - name: Build ubs-engine
            run: | 
                set -eux
                ls -al
                bash build.sh ubse
                bash build.sh ubsectl
                bash build.sh ubse_sdk
      ubs-engine_ut:
        name: ubs-engine_ut
        runs-on: [self-hosted, openeuler, arm, cpu=32]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/ubscore/build-openeuler-24.03-lts-sp3-arm:latest
        steps:
          - name: Checkout Source Code
            uses: checkout
            with:
              ref: refs/merge-requests/${{ env.pr_id }}/merge
              allow-unsafe-pr-checkout: true
          - name: install ubs-comm
            run: | 
                echo '[updates1]' >> /etc/yum.repos.d/openEuler.repo
                echo 'name=local_base1' >> /etc/yum.repos.d/openEuler.repo
                echo 'baseurl=https://eulermaker.openeuler.openatom.cn/api/ems2/repositories/BeiMing_openEuler2403_Next/openEuler%3A24.03-LTS-SP3/aarch64/' >> /etc/yum.repos.d/openEuler.repo
                echo 'gpgcheck=0' >> /etc/yum.repos.d/openEuler.repo
                echo 'enable=1' >> /etc/yum.repos.d/openEuler.repo
                yum install -y ubs-comm-devel
          - name: UT ubs-engine
            run: | 
                set -eux
                sudo dnf install -y gmock-devel
                ls -al
                bash build.sh ubs-engine_ut_independent_ut -C -j 8