# ASAN 报告白名单
# ================
# 用途：在采集报告（scripts/asan_report.sh）时屏蔽已知误报，避免在大量误报中
#       反复翻找真实问题，只保留未列入白名单的"新增/疑似真实问题"。
#
# 规则格式：
#   - 每行一条扩展正则（grep -E / ERE），'#' 开头的行与空行会被忽略；
#   - 匹配语义：一个错误块（==PID==ERROR: 起始的一段 ASAN/LSAN 报告）中，
#     任意一行命中任意一条规则，该错误块整块被屏蔽，不计入"剩余问题"；
#   - 规则应尽量具体（错误类型 + 关键函数/文件/符号），避免规则过宽误屏蔽
#     未来的真实问题。
#
# 维护方式：
#   当人工确认某条报告为误报后，把能唯一标识它的特征追加一行即可，例如：
#     LeakSanitizer.*xxx\.cpp    （泄漏报告，栈帧落在 xxx.cpp）
#     stack-buffer-overflow.*yyy （越界报告，出错在 yyy 路径）
#   若某条已修复/不再出现，可删除对应行，让该类问题重新纳入报告。

